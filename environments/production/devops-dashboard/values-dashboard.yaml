name: devops-dashboard
namespace: production-devops-dashboard
replicaCount: 2

# Evite le Multi-Attach du disque RWO lors d'un deploiement.
strategy:
  type: Recreate

image:
  repository: "windazureacrch0s.azurecr.io/devops-dashboard"
  tag: "8040614d110d38269a5f2fa5e5f24fb7b0c8f360"
  pullPolicy: Always
imagePullSecrets:
  - name: azureacr-secret

serviceAccount:
  create: false
  name: devops-dashboard-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: devops-dashboard.20.240.228.74.nip.io
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - devops-dashboard-prod.swedencentral.cloudapp.azure.com
      secretName: devops-dashboard-tls

persistence:
  enabled: true
  mountDir: "/data"
  fileName: "devops_dashboard.db"
  size: 500Mi
  mountWholeDir: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: DATABASE_URL
    value: "sqlite:////data/devops_dashboard.db"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: GITHUB_REPOS
    value: "winddevops-org/devops-templates,winddevops-org/gitops-environments"
  - name: ARGOCD_STAGING_URL
    value: "http://192.168.1.101:31486"
  - name: ARGOCD_PROD_URL
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PROD_URL
  - name: ARGOCD_USERNAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_USERNAME
  - name: ARGOCD_PASSWORD
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PASSWORD
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_TOKEN
  - name: GITHUB_ORG
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_ORG
  - name: AZURE_SUBSCRIPTION_ID
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: AZURE_SUBSCRIPTION_ID
  - name: PRODUCTION_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: PRODUCTION_CLUSTER_NAME
  - name: STAGING_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: STAGING_CLUSTER_NAME
  - name: CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: CLUSTER_NAME
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: SECRET_KEY
  - name: STAGING_KUBECONFIG
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: STAGING_KUBECONFIG
  # ✅ AJOUT CRUCIAL : Nom exact du contexte dans le kubeconfig staging
  - name: K8S_CONTEXT
    value: "kubernetes-admin@kubernetes"

database:
  enabled: false
  type: ""
  name: ""
  storage: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ha:
    enabled: true
    replicas: 2
    proxy:
      enabled: true
      replicas: 2

tailscale:
  enabled: true
  authKey: "REMPLACE_PAR_TA_CLE_ACTUELLE"
  extraArgs: "--accept-routes"
