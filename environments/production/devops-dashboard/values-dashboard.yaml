name: devops-dashboard
namespace: production-devops-dashboard
replicaCount: 1

# Evite le Multi-Attach du disque RWO lors d'un deploiement.
# Pris en compte uniquement si le chart generique contient le bloc optionnel
# {{- with .Values.strategy }} ... {{- end }} ; sinon ignore sans effet.
strategy:
  type: Recreate

image:
  repository: "windazureacrch0s.azurecr.io/devops-dashboard"
  tag: "1de1a7779f75d5e8afd01a241851fce125367220"
  pullPolicy: Always
imagePullSecrets:
  - name: azureacr-secret

serviceAccount:
  create: false
  name: devops-dashboard-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  host: devops-dashboard.20.240.228.74.nip.io
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - devops-dashboard-prod.swedencentral.cloudapp.azure.com
      secretName: devops-dashboard-tls

persistence:
  enabled: true
  mountDir: "/data"
  fileName: "devops_dashboard.db"
  size: 500Mi
  mountWholeDir: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: DATABASE_URL
    value: "sqlite:////data/devops_dashboard.db"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: GITHUB_REPOS
    value: "winddevops-org/devops-templates,winddevops-org/gitops-environments"
  # URL en clair (ce n'est pas un secret) : evite la dependance au Secret
  - name: ARGOCD_STAGING_URL
    value: "http://192.168.1.101:31486"
  - name: ARGOCD_PROD_URL
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PROD_URL
  - name: ARGOCD_USERNAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_USERNAME
  - name: ARGOCD_PASSWORD
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PASSWORD
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_TOKEN
  - name: GITHUB_ORG
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_ORG
  - name: AZURE_SUBSCRIPTION_ID
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: AZURE_SUBSCRIPTION_ID
  - name: PRODUCTION_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: PRODUCTION_CLUSTER_NAME
  - name: STAGING_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: STAGING_CLUSTER_NAME
  - name: CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: CLUSTER_NAME
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: SECRET_KEY
  # Kubeconfig du cluster staging (on-premise), lu par kubernetes_service.py
  - name: STAGING_KUBECONFIG
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: STAGING_KUBECONFIG

database:
  enabled: false
  type: ""
  name: ""
  storage: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ha:
    enabled: true
    replicas: 2
    proxy:
      enabled: true
      replicas: 2

# === TAILSCALE ===
# Ce bloc n'est pas utilise par le template deployment.yaml (aucune reference
# a .Values.tailscale). L'acces au staging passe par le Deployment
# tailscale-router cree a part. Remets ta cle actuelle ici si tu gardes le bloc,
# ou supprime-le.
tailscale:
  enabled: true
  authKey: "REMPLACE_PAR_TA_CLE_ACTUELLE"
  extraArgs: "--accept-routes"
