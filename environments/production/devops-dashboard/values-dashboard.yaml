name: devops-dashboard
namespace: production-devops-dashboard
replicaCount: 2
image:
  repository: "windazureacrch0s.azurecr.io/devops-dashboard"
  tag: "7ddef804ba36d41e0546092a4a8365311de74376"
  pullPolicy: Always
imagePullSecrets:
  - name: azureacr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  host: devops-dashboard.20.240.228.74.nip.io
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - devops-dashboard-prod.swedencentral.cloudapp.azure.com
      secretName: devops-dashboard-tls

persistence:
  enabled: true
  mountDir: "/data"
  fileName: "devops_dashboard.db"
  size: 500Mi
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
env: []
database:
  enabled: false
  type: ""
  name: ""
  storage: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ha:
    enabled: true
    replicas: 2
    proxy:
      enabled: true
      replicas: 2
