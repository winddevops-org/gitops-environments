name: devops-dashboard
namespace: production-devops-dashboard
replicaCount: 1
image:
  repository: "windazureacrch0s.azurecr.io/devops-dashboard"
  tag: "b73edb7ad1f28f57fbc5a1af6e5c8a1b94ed90d3"
  pullPolicy: Always
imagePullSecrets:
  - name: azureacr-secret

serviceAccount:
  create: false
  name: devops-dashboard-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  host: devops-dashboard-prod.swedencentral.cloudapp.azure.com
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - devops-dashboard-prod.swedencentral.cloudapp.azure.com
      secretName: devops-dashboard-tls

persistence:
  enabled: true
  mountDir: "/data"
  fileName: "devops_dashboard.db"
  size: 500Mi
  mountWholeDir: true   # monte le dossier /data entier (SQLite a besoin d'ecrire son journal)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# --- CORRECTION CRUCIALE : Forcer l'utilisation du volume persistant ---
env:
  - name: DATABASE_URL
    value: "sqlite:////data/devops_dashboard.db"
  - name: ARGOCD_STAGING_URL
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_STAGING_URL
  - name: ARGOCD_PROD_URL
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PROD_URL
  - name: ARGOCD_USERNAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_USERNAME
  - name: ARGOCD_PASSWORD
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: ARGOCD_PASSWORD
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_TOKEN
  - name: GITHUB_ORG
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: GITHUB_ORG
  - name: AZURE_SUBSCRIPTION_ID
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: AZURE_SUBSCRIPTION_ID
  - name: PRODUCTION_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: PRODUCTION_CLUSTER_NAME
  - name: STAGING_CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: STAGING_CLUSTER_NAME
  - name: CLUSTER_NAME
    valueFrom:
      secretKeyRef:
        name: devops-dashboard-secrets
        key: CLUSTER_NAME
# -----------------------------------------------------------------------

database:
  enabled: false
  type: ""
  name: ""
  storage: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ha:
    enabled: true
    replicas: 2
    proxy:
      enabled: true
      replicas: 2
